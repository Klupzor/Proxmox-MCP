# Nextcloud (LAN-only) — PostgreSQL + Redis + cron, HTTPS via Caddy (homelab private CA).
#   https://192.168.1.27:8443  (http://192.168.1.27:8081 redirects there)
# Secrets come from stacks/nextcloud/.env (gitignored); see .env.example.
#
# Layout:
#   app_html (named volume, LXC rootfs)  -> /var/www/html   code + config (included in CT 100 backups)
#   /mnt/data/NextcloudData (host disk)  -> /srv/nc         old install's data root; the NEW data
#                                                           directory is /srv/nc/data, so importing
#                                                           the old files is a same-mount rename.
#   pgdata (named volume)                -> PostgreSQL data
# The admin account is created by the operator in the web installer (username must
# match NC_IMPORT_USER for the one-off file import).

services:
  app:
    image: nextcloud:34.0.4-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No published ports: only reachable through the `proxy` service.
    volumes:
      - app_html:/var/www/html
      - /mnt/data/NextcloudData:/srv/nc
    environment:
      NEXTCLOUD_TRUSTED_DOMAINS: 192.168.1.27
      NEXTCLOUD_DATA_DIR: /srv/nc/data
      # Pre-fills the database in the web installer (autoconfig).
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # Redis for file locking + distributed cache (image writes redis.config.php).
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      # Large uploads on the LAN.
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 16G
      APACHE_BODY_LIMIT: "0"
      # Behind the Caddy proxy (image writes reverse-proxy.config.php from these).
      TRUSTED_PROXIES: 172.16.0.0/12
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://192.168.1.27:8443
      # Used only by the one-off `import_old_files` migration command.
      NC_IMPORT_USER: Andres
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/status.php') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 2g
    cpus: 2

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8443:8443"   # HTTPS
      - "8081:8081"   # redirect only
    environment:
      # Base64 PEMs from .env (gitignored); decoded to tmpfs at start.
      TLS_CERT_B64: ${NC_TLS_CERT_B64:?set in .env}
      TLS_KEY_B64: ${NC_TLS_KEY_B64:?set in .env}
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        printf '%s' "$$TLS_CERT_B64" | base64 -d > /tmp/cert.pem
        printf '%s' "$$TLS_KEY_B64" | base64 -d > /tmp/key.pem
        cat > /tmp/Caddyfile <<'EOF'
        {
          admin off
          auto_https off
        }
        :8443 {
          tls /tmp/cert.pem /tmp/key.pem
          header Strict-Transport-Security "max-age=15552000"
          # No body-size or timeout limits: large uploads and long final joins must pass.
          reverse_proxy app:80
        }
        :8081 {
          redir https://{host}:8443{uri} permanent
        }
        EOF
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1

  cron:
    image: nextcloud:34.0.4-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      - app
    volumes_from:
      - app
    environment:
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache/locking only: no persistence, so a read-only rootfs is fine.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    user: "999:1000"
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.5

volumes:
  app_html:
  pgdata:
